<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Письмо преподавателю — Kupala Hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Onest:wght@400;500;600&amp;family=Unbounded:wght@500;600&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F5F8;color:#15171C;font-family:Onest,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0C6E5F;text-decoration:none}a:hover{color:#095A4E}
:focus-visible{outline:2px solid #0C6E5F;outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
.dm{font:600 22px/28px Unbounded,sans-serif;letter-spacing:-.01em}
.bm{font:400 15px/22px Onest,sans-serif}
.bs{font:400 13px/18px Onest,sans-serif}
.lm{font:500 14px/18px Onest,sans-serif}
.ls{font:500 12px/16px Onest,sans-serif}
.mu{color:#5F6878}.m2{color:#475161}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:600 14px/18px Onest,sans-serif;white-space:nowrap;cursor:pointer;text-decoration:none}
.bp{background:#0C6E5F;color:#FFFFFF}.bp:hover{background:#095A4E;color:#FFFFFF}
.b2{background:#FFFFFF;color:#15171C;border-color:#C9D0DA}.b2:hover{background:#ECEFF3;color:#15171C}
.sk{border-radius:16px;background:#FFFFFF;border:1px solid #E2E6EC}
.inp{width:100%;height:46px;padding:0 14px;border:1px solid #8A94A4;border-radius:12px;background:#FFFFFF;font:400 15px/21px Onest,sans-serif;color:#15171C;outline:0}
.inp:focus,.ta:focus{border-color:#0C6E5F;box-shadow:0 0 0 3px #DDF0EB}
.ta{width:100%;min-height:200px;padding:12px 14px;border:1px solid #8A94A4;border-radius:12px;background:#FFFFFF;font:400 15px/22px Onest,sans-serif;color:#15171C;outline:0;resize:vertical}
</style>
</helmet>
<div style="position:relative;min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#F3F5F8;overflow:hidden">
  <div style="flex:1 1 248px;background:#F3F5F8;border-right:1px solid #E2E6EC">
    <dc-import name="Sidebar" active="teachers" hint-size="100%,880px"></dc-import>
  </div>
  <main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <dc-import name="Topbar" heading="Преподаватели" subheading="Кто ведёт пары у ПИ-31 и где они сейчас" hint-size="100%,72px"></dc-import>
    <div aria-hidden="true" style="padding:8px 32px 32px;display:flex;flex-wrap:wrap;gap:20px">
      <div class="sk" style="flex:1 1 320px;height:340px"></div>
      <div style="flex:999 1 520px;display:flex;flex-direction:column;gap:16px">
        <div class="sk" style="height:118px"></div>
        <div style="display:flex;gap:16px">
          <div style="flex:1;height:230px;border-radius:20px;background:#15171C"></div>
          <div class="sk" style="flex:2;height:230px"></div>
        </div>
        <div style="height:46px;border-radius:12px;background:#ECE6FB"></div>
      </div>
    </div>
  </main>

  <a href="Teachers.dc.html" aria-label="Закрыть письмо" style="position:absolute;inset:0;z-index:10;background:rgba(21,23,28,.45)"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="em-h" style="position:absolute;z-index:11;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;max-width:calc(100% - 32px);background:#FFFFFF;border-radius:20px;box-shadow:0 24px 64px rgba(21,23,28,.28);padding:24px;display:flex;flex-direction:column;gap:16px">
    <div class="row" style="justify-content:space-between">
      <h2 class="dm" id="em-h">Письмо преподавателю</h2>
      <a href="Teachers.dc.html" aria-label="Закрыть" style="width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#475161;background:#F3F5F8"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>

    <div class="row" style="gap:10px">
      <span class="ls m2" style="width:44px">Кому</span>
      <span class="row" style="gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:#F3F5F8">
        <span aria-hidden="true" style="width:28px;height:28px;border-radius:50%;background:#0C6E5F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:600 11px/1 Onest,sans-serif">КА</span>
        <span class="lm">Ковалёв А. С.</span>
      </span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="es" class="ls m2">Тема</label>
      <input id="es" class="inp" type="text" value="{{subject}}" onChange="{{setSubject}}">
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="eb" class="ls m2">Текст письма</label>
      <textarea id="eb" class="ta" value="{{body}}" onChange="{{setBody}}"></textarea>
    </div>

    <div class="row" style="gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#DDF0EB">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#0C6E5F;margin-top:1px"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/></svg>
      <p class="bs">Черновик составил ассистент. Письмо отправляется из вашей почты — приложение само ничего не отправляет.</p>
    </div>

    <div class="row" style="justify-content:flex-end;gap:8px;flex-wrap:wrap">
      <a class="btn b2" href="AssistantPlan.dc.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;color:#0C6E5F"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
        Изменить с ассистентом
      </a>
      <button type="button" class="btn bp">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9.5a1 1 0 0 0 1 1h3.5"/></svg>
        Скопировать письмо
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const body = 'Здравствуйте!\n\nЯ студентка группы ПИ-31. Сегодня не смогу быть на лекции по базам данных по болезни. Подскажите, пожалуйста, как лучше отработать пропущенный материал?\n\nС уважением,\nАнна К.';
    return {
      subject: s.subject === undefined ? 'Пропуск лекции 10 ноября' : s.subject,
      setSubject: (e) => this.setState({ subject: e.target.value }),
      body: s.body === undefined ? body : s.body,
      setBody: (e) => this.setState({ body: e.target.value })
    };
  }
}
</script>
</body>
</html>
