<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Маршрут — Kupala Hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Onest:wght@400;500;600&amp;family=Unbounded:wght@500;600&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F5F8;color:#15171C;font-family:Onest,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0C6E5F;text-decoration:none}a:hover{color:#095A4E}
:focus-visible{outline:2px solid #0C6E5F;outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
.dm{font:600 22px/28px Unbounded,sans-serif;letter-spacing:-.01em}
.bs{font:400 13px/18px Onest,sans-serif}
.lm{font:500 14px/18px Onest,sans-serif}
.ls{font:500 12px/16px Onest,sans-serif}
.cap{font:500 12px/16px Onest,sans-serif}
.mu{color:#5F6878}.m2{color:#475161}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:600 14px/18px Onest,sans-serif;white-space:nowrap;cursor:pointer;text-decoration:none}
.bp{background:#0C6E5F;color:#FFFFFF}.bp:hover{background:#095A4E;color:#FFFFFF}
.b2{background:#FFFFFF;color:#15171C;border-color:#C9D0DA}.b2:hover{background:#ECEFF3;color:#15171C}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font:600 11px/14px Onest,sans-serif;white-space:nowrap}
.b-ok{background:#DDF1E4;color:#1E7A45}
.sk{border-radius:16px;background:#FFFFFF;border:1px solid #E2E6EC}
.lbl{position:absolute;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:#FFFFFF;box-shadow:0 2px 8px rgba(21,23,28,.12);font:600 12px/16px Onest,sans-serif;color:#15171C;white-space:nowrap}
</style>
</helmet>
<div style="position:relative;min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#F3F5F8;overflow:hidden">
  <div style="flex:1 1 248px;background:#F3F5F8;border-right:1px solid #E2E6EC">
    <dc-import name="Sidebar" active="today" hint-size="100%,880px"></dc-import>
  </div>
  <main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <dc-import name="Topbar" heading="Привет, Аня" subheading="Вторник, 10 ноября · неделя 11 · ПИ-31" hint-size="100%,72px"></dc-import>
    <div aria-hidden="true" style="padding:8px 32px 32px;display:flex;flex-wrap:wrap;gap:20px">
      <div style="flex:999 1 560px;display:flex;flex-direction:column;gap:20px">
        <div style="height:250px;border-radius:20px;background:#15171C"></div>
        <div class="sk" style="height:200px"></div>
        <div style="display:flex;gap:20px"><div style="flex:1;height:160px;border-radius:16px;background:#FFF1D6"></div><div class="sk" style="flex:1;height:160px"></div></div>
      </div>
      <div style="flex:1 1 360px;display:flex;flex-direction:column;gap:20px">
        <div class="sk" style="height:400px"></div>
        <div class="sk" style="height:240px"></div>
      </div>
    </div>
  </main>

  <a href="Main.dc.html" aria-label="Закрыть маршрут" style="position:absolute;inset:0;z-index:10;background:rgba(21,23,28,.45)"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="rt-h" style="position:absolute;z-index:11;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;max-width:calc(100% - 32px);background:#FFFFFF;border-radius:20px;box-shadow:0 24px 64px rgba(21,23,28,.28);padding:24px;display:flex;flex-direction:column;gap:18px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:4px">
        <h2 class="dm" id="rt-h">Маршрут до корпуса ФМИ</h2>
        <p class="bs mu">После лекции по базам данных — на практику по веб-программированию</p>
      </div>
      <a href="Main.dc.html" aria-label="Закрыть" style="width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#475161;background:#F3F5F8"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>

    <div role="img" aria-label="Схема: от главного корпуса, ауд. 312, до корпуса ФМИ, ауд. 115" style="position:relative;height:230px;border-radius:14px;overflow:hidden;background:#ECEFF3">
      <div style="position:absolute;left:0;right:0;top:118px;height:14px;background:#F3F5F8"></div>
      <div style="position:absolute;top:0;bottom:0;left:300px;width:14px;background:#F3F5F8"></div>
      <div style="position:absolute;top:0;bottom:0;left:120px;width:10px;background:#F3F5F8"></div>
      <div style="position:absolute;left:28px;top:26px;width:150px;height:72px;border-radius:8px;background:#C9D0DA"></div>
      <div style="position:absolute;left:340px;top:150px;width:150px;height:60px;border-radius:8px;background:#C9D0DA"></div>
      <div style="position:absolute;left:200px;top:24px;width:80px;height:70px;border-radius:8px;background:#E2E6EC"></div>
      <div style="position:absolute;left:28px;top:150px;width:240px;height:56px;border-radius:8px;background:#E2E6EC"></div>
      <svg viewBox="0 0 512 230" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#FF6A3D;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 8">
        <path d="M150 98 V125 H307 V180 H340"/>
      </svg>
      <span style="position:absolute;left:142px;top:90px;width:16px;height:16px;border-radius:50%;background:#15171C;border:3px solid #FFFFFF"></span>
      <span style="position:absolute;left:332px;top:172px;width:16px;height:16px;border-radius:50%;background:#FF6A3D;border:3px solid #FFFFFF"></span>
      <span class="lbl" style="left:16px;top:8px">Главный корпус · ауд. 312</span>
      <span class="lbl" style="right:16px;top:118px">Корпус ФМИ · ауд. 115</span>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div style="flex:1 1 200px;padding:14px 16px;border-radius:14px;background:#F3F5F8;display:flex;flex-direction:column;gap:4px">
        <span style="font:700 24px/30px 'JetBrains Mono',monospace">≈ 12 мин</span>
        <span class="bs m2">пешком</span>
      </div>
      <div style="flex:1 1 200px;padding:14px 16px;border-radius:14px;background:#DDF1E4;display:flex;flex-direction:column;gap:4px">
        <span style="font:700 24px/30px 'JetBrains Mono',monospace;color:#1E7A45">15 мин</span>
        <span class="bs" style="color:#1E7A45">перерыв — успеваете</span>
      </div>
    </div>

    <p class="cap mu">Схема условная (демо). Точный маршрут откроется в картах.</p>

    <div class="row" style="justify-content:flex-end;gap:8px;flex-wrap:wrap">
      <a class="btn b2" href="Main.dc.html">Закрыть</a>
      <a class="btn bp" href="https://yandex.by/maps/">
        Открыть в Яндекс Картах
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
