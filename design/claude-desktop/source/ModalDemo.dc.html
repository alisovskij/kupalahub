<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Демо-режим — Kupala Hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Onest:wght@400;500;600&amp;family=Unbounded:wght@500;600&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F5F8;color:#15171C;font-family:Onest,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0C6E5F;text-decoration:none}a:hover{color:#095A4E}
:focus-visible{outline:2px solid #0C6E5F;outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
.dm{font:600 22px/28px Unbounded,sans-serif;letter-spacing:-.01em}
.bs{font:400 13px/18px Onest,sans-serif}
.lm{font:500 14px/18px Onest,sans-serif}
.ls{font:500 12px/16px Onest,sans-serif}
.ov{font:600 11px/14px Onest,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.mu{color:#5F6878}.m2{color:#475161}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:600 14px/18px Onest,sans-serif;white-space:nowrap;cursor:pointer;text-decoration:none}
.bp{background:#0C6E5F;color:#FFFFFF}.bp:hover{background:#095A4E;color:#FFFFFF}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font:600 11px/14px Onest,sans-serif;white-space:nowrap}
.b-ok{background:#DDF1E4;color:#1E7A45}.b-demo{background:#ECE6FB;color:#5A3DB0}.b-sem{background:#EBEEF2;color:#475161}
.sk{border-radius:16px;background:#FFFFFF;border:1px solid #E2E6EC}
.src{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #E2E6EC}
.sc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid #E2E6EC;cursor:pointer}
.sc input{width:18px;height:18px;margin:0;flex:none;accent-color:#0C6E5F}
</style>
</helmet>
<div style="position:relative;min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#F3F5F8;overflow:hidden">
  <div style="flex:1 1 248px;background:#F3F5F8;border-right:1px solid #E2E6EC">
    <dc-import name="Sidebar" active="today" hint-size="100%,880px"></dc-import>
  </div>
  <main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <dc-import name="Topbar" heading="Привет, Аня" subheading="Вторник, 10 ноября · неделя 11 · ПИ-31" hint-size="100%,72px"></dc-import>
    <div aria-hidden="true" style="padding:8px 32px 32px;display:flex;flex-wrap:wrap;gap:20px">
      <div style="flex:999 1 560px;display:flex;flex-direction:column;gap:20px">
        <div style="height:250px;border-radius:20px;background:#15171C"></div>
        <div class="sk" style="height:200px"></div>
        <div style="display:flex;gap:20px"><div style="flex:1;height:160px;border-radius:16px;background:#FFF1D6"></div><div class="sk" style="flex:1;height:160px"></div></div>
      </div>
      <div style="flex:1 1 360px;display:flex;flex-direction:column;gap:20px">
        <div class="sk" style="height:400px"></div>
        <div class="sk" style="height:240px"></div>
      </div>
    </div>
  </main>

  <a href="Main.dc.html" aria-label="Закрыть окно" style="position:absolute;inset:0;z-index:10;background:rgba(21,23,28,.45)"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="dm-h" style="position:absolute;z-index:11;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;max-width:calc(100% - 32px);background:#FFFFFF;border-radius:20px;box-shadow:0 24px 64px rgba(21,23,28,.28);padding:24px;display:flex;flex-direction:column;gap:16px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:4px">
        <h2 class="dm" id="dm-h">Демо-режим</h2>
        <p class="bs mu">Что в приложении настоящее, а что — тестовое</p>
      </div>
      <a href="Main.dc.html" aria-label="Закрыть" style="width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#475161;background:#F3F5F8"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>

    <div>
      <div class="src" style="border-top:0"><span class="lm">Расписание групп и преподавателей</span><span class="badge b-ok">API ГрГУ</span></div>
      <div class="src"><span class="lm">Свободные аудитории</span><span class="badge b-ok">Вычисляется из API</span></div>
      <div class="src"><span class="lm">Оценки и пропуски</span><span class="badge b-demo">Демо</span></div>
      <div class="src"><span class="lm">Задания и материалы ЭУМК</span><span class="badge b-demo">Демо</span></div>
      <div class="src"><span class="lm">Сессия</span><span class="badge b-demo">Демо</span></div>
      <div class="src"><span class="lm">Ответы ассистента</span><span class="badge b-sem">По данным выше</span></div>
    </div>

    <fieldset style="border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:8px">
      <legend class="ov mu" style="padding:0;margin-bottom:10px">Сценарий демо</legend>
      <label class="sc" style="border-color:{{wBd}};background:{{wBg}}">
        <input type="radio" name="sc" checked="{{wOn}}" onChange="{{setW}}">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="lm">Обычная неделя</span><span class="bs mu">Пары, окна, одно изменение</span></span>
      </label>
      <label class="sc" style="border-color:{{sBd}};background:{{sBg}}">
        <input type="radio" name="sc" checked="{{sOn}}" onChange="{{setS}}">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="lm">Сессия через 14 дней</span><span class="bs mu">Ассистент предложит план подготовки</span></span>
      </label>
      <label class="sc" style="border-color:{{dBd}};background:{{dBg}}">
        <input type="radio" name="sc" checked="{{dOn}}" onChange="{{setD}}">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="lm">Есть задолженность</span><span class="bs mu">Зона риска и напоминания о пересдаче</span></span>
      </label>
    </fieldset>

    <div class="row" style="justify-content:flex-end">
      <a class="btn bp" href="Main.dc.html">Применить сценарий</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const sc = (this.state && this.state.sc) || 'w';
    const v = {};
    ['w', 's', 'd'].forEach((k) => {
      const on = sc === k;
      v[k + 'On'] = on;
      v[k + 'Bd'] = on ? '#0C6E5F' : '#E2E6EC';
      v[k + 'Bg'] = on ? '#DDF0EB' : '#FFFFFF';
    });
    v.setW = () => this.setState({ sc: 'w' });
    v.setS = () => this.setState({ sc: 's' });
    v.setD = () => this.setState({ sc: 'd' });
    return v;
  }
}
</script>
</body>
</html>
