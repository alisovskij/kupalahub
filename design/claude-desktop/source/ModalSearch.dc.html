<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поиск — Kupala Hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Onest:wght@400;500;600&amp;family=Unbounded:wght@500;600&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F5F8;color:#15171C;font-family:Onest,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0C6E5F;text-decoration:none}a:hover{color:#095A4E}
:focus-visible{outline:2px solid #0C6E5F;outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
.bs{font:400 13px/18px Onest,sans-serif}
.lm{font:500 14px/18px Onest,sans-serif}
.cap{font:500 12px/16px Onest,sans-serif}
.ov{font:600 11px/14px Onest,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.mu{color:#5F6878}.m2{color:#475161}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:12px}
.ibox{width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#ECEFF3;color:#15171C}
.sk{border-radius:16px;background:#FFFFFF;border:1px solid #E2E6EC}
.kbd{display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:6px;background:#ECEFF3;font:500 11px/14px 'JetBrains Mono',monospace;color:#475161}
.grp{padding:12px 20px 4px;color:#5F6878}
.res{display:flex;align-items:center;gap:12px;padding:10px 20px;color:#15171C;text-decoration:none}
.res:hover{background:#F8FAFC;color:#15171C}
</style>
</helmet>
<div style="position:relative;min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#F3F5F8;overflow:hidden">
  <div style="flex:1 1 248px;background:#F3F5F8;border-right:1px solid #E2E6EC">
    <dc-import name="Sidebar" active="today" hint-size="100%,880px"></dc-import>
  </div>
  <main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <dc-import name="Topbar" heading="Привет, Аня" subheading="Вторник, 10 ноября · неделя 11 · ПИ-31" hint-size="100%,72px"></dc-import>
    <div aria-hidden="true" style="padding:8px 32px 32px;display:flex;flex-wrap:wrap;gap:20px">
      <div style="flex:999 1 560px;display:flex;flex-direction:column;gap:20px">
        <div style="height:250px;border-radius:20px;background:#15171C"></div>
        <div class="sk" style="height:200px"></div>
        <div style="display:flex;gap:20px"><div style="flex:1;height:160px;border-radius:16px;background:#FFF1D6"></div><div class="sk" style="flex:1;height:160px"></div></div>
      </div>
      <div style="flex:1 1 360px;display:flex;flex-direction:column;gap:20px">
        <div class="sk" style="height:400px"></div>
        <div class="sk" style="height:240px"></div>
      </div>
    </div>
  </main>

  <a href="Main.dc.html" aria-label="Закрыть поиск" style="position:absolute;inset:0;z-index:10;background:rgba(21,23,28,.45)"></a>

  <section role="dialog" aria-label="Поиск" style="position:absolute;z-index:11;top:96px;left:50%;transform:translateX(-50%);width:640px;max-width:calc(100% - 32px);background:#FFFFFF;border-radius:20px;box-shadow:0 24px 64px rgba(21,23,28,.28);overflow:hidden">
    <label class="row" style="padding:0 16px 0 20px;min-height:60px;border-bottom:1px solid #E2E6EC">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color:#0C6E5F"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Что найти</span>
      <input type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Группа, преподаватель, аудитория" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 17px/22px Onest,sans-serif;color:#15171C">
      <a href="Main.dc.html" class="kbd" style="text-decoration:none">Esc</a>
    </label>

    <div style="padding:6px 0 10px">
      <p class="ov grp">Преподаватели</p>
      <a class="res" href="Teachers.dc.html" style="background:#F3F5F8">
        <span class="ibox" style="background:#0C6E5F;color:#FFFFFF;border-radius:50%;font:600 12px/1 Onest,sans-serif">КА</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="lm"><b style="font-weight:700">Ковал</b>ёв А. С.</span><span class="bs mu">Базы данных · сейчас в ауд. 312</span></span>
        <span class="kbd">Enter</span>
      </a>
      <p class="ov grp">Аудитории</p>
      <a class="res" href="Rooms.dc.html">
        <span class="ibox"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20.5V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5v16M3.5 20.5h17M14.5 12h.01"/></svg></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="lm">Ауд. 214</span><span class="bs mu">Главный корпус · свободна до 14:20</span></span>
      </a>
      <p class="ov grp">Группы</p>
      <a class="res" href="ScheduleLesson.dc.html">
        <span class="ibox"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.3 3.3-5.5 6.5-5.5s5.8 2.2 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.6c1.9.8 3.1 2.7 3.5 5.4"/></svg></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="lm">ПИ-32</span><span class="bs mu">ФМИ · 3 курс · расписание группы</span></span>
      </a>
      <p class="ov grp">Ассистент</p>
      <a class="res" href="AssistantPlan.dc.html">
        <span class="ibox" style="background:#DDF0EB;color:#0C6E5F"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="lm">Где сейчас Ковалёв?</span><span class="bs mu">Ответ по расписанию преподавателя</span></span>
      </a>
    </div>

    <div class="row cap mu" style="gap:16px;padding:12px 20px;border-top:1px solid #E2E6EC;background:#F8FAFC;flex-wrap:wrap">
      <span class="row" style="gap:6px"><span class="kbd">↑</span><span class="kbd">↓</span>выбрать</span>
      <span class="row" style="gap:6px"><span class="kbd">Enter</span>открыть</span>
      <span class="row" style="gap:6px"><span class="kbd">Esc</span>закрыть</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    return {
      q: s.q === undefined ? 'ковал' : s.q,
      setQ: (e) => this.setState({ q: e.target.value })
    };
  }
}
</script>
</body>
</html>
