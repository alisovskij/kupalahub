</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","schedule","study","assistant","rooms","teachers","settings"],"default":"today"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today';
    const v = {};
    ['today', 'schedule', 'study', 'assistant', 'rooms', 'teachers'].forEach((k) => {
      const on = a === k;
      v[k + 'Bg'] = on ? '#DDF0EB' : 'transparent';
      v[k + 'Fg'] = on ? '#0C6E5F' : '#475161';
      v[k + 'Fw'] = on ? '600' : '500';
      v[k + 'Cur'] = on ? 'page' : 'false';
    });
    v.setBg = a === 'settings' ? '#DDF0EB' : 'transparent';
    v.setCur = a === 'settings' ? 'page' : 'false';
    return v;
  }
}
</script>
