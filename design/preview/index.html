<div class="workspace"><header class="topbar"><div class="crumb">Моё пространство<svg style="width:12px"><use href="#chevron"/></svg><b id="crumb-title">Сегодня</b></div><div class="top-actions"><button class="search" data-action="search"><svg style="width:16px"><use href="#search"/></svg>Найти в приложении<kbd>Ctrl K</kbd></button><button class="icon-btn" data-action="notifications" aria-label="Уведомления"><svg style="width:17px"><use href="#bell"/></svg><i class="dot"></i></button><button class="icon-btn" data-action="theme" aria-label="Включить тёмную тему"><svg style="width:17px"><use href="#sun"/></svg></button><span class="separator"></span><span class="review-badge">Макет · v1</span></div></header>
<main id="main"></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const icon=(name)=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const esc=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles={today:'Сегодня',schedule:'Расписание',tasks:'Задачи',assistant:'Ассистент'};
let tasks=[{id:1,title:'Отчёт по лабораторной №4',subject:'Базы данных',date:'Сегодня, 23:59',priority:'Высокий',done:false},{id:2,title:'Прочитать главу 3',subject:'Теория вероятностей',date:'12 ноября',priority:'Обычный',done:false},{id:3,title:'Вопросы к семинару',subject:'Философия',date:'11 ноября',priority:'Обычный',done:false},{id:4,title:'Доработать страницу портфолио',subject:'Веб-программирование',date:'13 ноября',priority:'Обычный',done:false},{id:5,title:'Повторить SQL JOIN',subject:'Базы данных',date:'Сегодня',priority:'Обычный',done:true}];
const lessons=[{name:'Теория вероятностей',time:'08:30',end:'09:50',type:'Лекция',teacher:'Смирнова Е. В.',room:'410',building:'Главный корпус'},{name:'Базы данных',time:'10:05',end:'11:25',type:'Лекция',teacher:'Ковалёв А. С.',room:'312',building:'Главный корпус'},{name:'Веб-программирование',time:'11:40',end:'13:00',type:'Практика',teacher:'Лис Д. Н.',room:'115',building:'Корпус ФМИ'},{name:'Английский язык',time:'14:20',end:'15:40',type:'Практика',teacher:'Петрова И. А.',room:'204',building:'Главный корпус'}];
let page='today',scheduleMode='week',filter='all',dialogOpener=null,toastTimer;
const main=document.getElementById('main'),dialog=document.getElementById('dialog');
const footer=()=>`<footer class="footer"><span><i class="status-dot"></i>Демо-сценарий · 10 ноября 2026, 10:47</span><span>Kupala Hub · Пространство для учёбы</span></footer>`;
const head=(title,sub,action='')=>`<div class="page-head"><div><h1 tabindex="-1">${title}</h1><p>${sub}</p></div>${action}</div>`;
const taskButton=()=>`<button class="btn primary" data-action="new-task">${icon('plus')}Новая задача</button>`;
function lessonRows(){return lessons.map((l,i)=>`${i===3?`<div class="break-row">${icon('clock')}Окно 1 ч 20 мин · можно заняться своими делами</div>`:''}<button class="lesson-row ${i===0?'finished':i===1?'current':''}" data-lesson="${i}"><span class="time"><strong>${l.time}</strong><small>${l.end}</small></span><i class="lesson-stripe"></i><span><h3>${l.name}${i===1?' <span class="tag">Сейчас</span>':''}</h3><p>${l.type} · ${l.teacher}</p></span><span class="room-tag">${l.room}${i===3?' · изм.':''}</span></button>`).join('');}
function miniTasks(){return tasks.slice(0,3).map(t=>`<label class="task-mini"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><div><strong>${esc(t.title)}</strong><small>${esc(t.subject)} · <span style="${t.id===1?'color:#b3724c':''}">${esc(t.date)}</span></small></div></label>`).join('');}
function today(){return head('Хорошего дня, Анна','Вторник, 10 ноября · 11-я учебная неделя',`<a class="btn" href="#schedule">${icon('calendar')}Открыть расписание</a>`)+`<div class="dashboard"><div class="main-col"><section class="hero"><div class="hero-top"><span class="live">Сейчас идёт пара</span><span>10:05 — 11:25</span></div><h2>Базы данных</h2><p class="hero-description">Лекция · Ковалёв Александр Сергеевич</p><div class="hero-info"><div class="hero-room"><div><small>Аудитория</small><strong class="orange">312</strong></div><div><small>Место</small><strong style="font-size:15px">Главный корпус</strong></div></div><span class="countdown"><b>38</b>мин до конца</span></div><div class="progress"><span></span></div><div class="hero-next"><span class="next-time">11:40</span><div><h3>Далее: веб-программирование</h3><p>Практика · ауд. 115, корпус ФМИ</p></div><button class="btn" data-lesson="2">Подробнее${icon('arrow')}</button></div></section><section class="update">${icon('bell')}<div><strong>У английского новая аудитория</strong><p>Сегодня в 14:20 · аудитория 204 вместо 410</p></div><button class="text-btn" data-action="notifications" aria-label="Посмотреть изменение">${icon('arrow')}<span class="hidden">Изменения</span></button></section><section class="panel"><div class="panel-head"><h2>Твой день</h2><span class="muted" style="font-size:11px">4 пары · до 15:40</span></div><div class="schedule-list">${lessonRows()}</div></section></div><aside class="right-col"><section class="panel"><div class="panel-head"><h2>На этой неделе</h2>${icon('calendar')}</div><div class="week-strip">${['Пн','Вт','Ср','Чт','Пт'].map((d,i)=>`<button class="day-dot ${i===1?'active':''}" data-action="week-day" data-day="${i}"><span>${d}</span><b>${i+9}</b><i></i></button>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>В фокусе</h2><a href="#tasks" class="text-btn">Все${icon('chevron')}</a></div><div class="tasks-mini">${miniTasks()}<button class="add-mini" data-action="new-task">${icon('plus')}Добавить задачу</button></div></section><section class="assistant-mini"><div class="row"><span class="spark">${icon('spark')}</span><h2>Чуть больше ясности</h2></div><p>После третьей пары есть окно.<br>Хватит времени, чтобы закончить отчёт по базам данных.</p><a class="btn" href="#assistant">Помоги спланировать день${icon('arrow')}</a></section></aside></div>`+footer();}
function calendar(){const cols=[[0,2,3],[0,1,2,3],[1,2],[0,1,3],[0,2]];return `<section class="panel calendar"><div class="cal-head"><div></div>${['Понедельник','Вторник','Среда','Четверг','Пятница'].map((d,i)=>`<div class="${i===1?'today':''}">${d}<b>${9+i}</b></div>`).join('')}</div><div class="cal-body"><div class="hours">${['08:30','10:05','11:40','13:15','14:50'].map(t=>`<span>${t}</span>`).join('')}</div>${cols.map((col,d)=>`<div class="day-column">${col.map((idx,j)=>{const l=lessons[idx],top=d===1?[5,116,227,414][j]:j*112+5;return `<button class="event ${d===1&&idx===1?'live-event':idx===2?'blue':idx===3?'orange':''}" style="top:${top}px;height:98px" data-lesson="${idx}" data-day="${d}" data-start="${d===1?l.time:['08:30','10:05','11:40'][j]}" data-end="${d===1?l.end:['09:50','11:25','13:00'][j]}"><span>${d===1?l.time:['08:30','10:05','11:40'][j]} — ${d===1?l.end:['09:50','11:25','13:00'][j]}</span><b>${l.name}</b><small>${l.type} · ауд. ${l.room}</small></button>`}).join('')}</div>`).join('')}</div><div class="cal-legend"><span><i></i>Лекция</span><span><i style="background:#b6c2e5"></i>Практика</span><span><i style="background:#ecb985"></i>Изменение</span><span style="margin-left:auto">ПИ-31 · подгруппа 1 · демо</span></div></section>`;}
function schedule(){return head('Расписание','Учебная неделя без неожиданностей',`<button class="btn" data-action="export">${icon('download')}Экспорт</button>`)+`<div class="toolbar"><button class="icon-btn" data-action="fixed-week" aria-label="Предыдущая неделя"><svg style="transform:rotate(180deg)"><use href="#chevron"/></svg></button><h2 style="font-size:16px">9 — 13 ноября</h2><button class="icon-btn" data-action="fixed-week" aria-label="Следующая неделя">${icon('chevron')}</button><button class="btn" data-action="current-day">Сегодня</button><span class="push"></span><button class="btn" data-action="group">${icon('people')}ПИ-31 · подгруппа 1</button><div class="segments"><button data-mode="day" class="${scheduleMode==='day'?'selected':''}">День</button><button data-mode="week" class="${scheduleMode==='week'?'selected':''}">Неделя</button></div></div>${scheduleMode==='week'?calendar():`<section class="panel"><div class="panel-head"><h2>Вторник, 10 ноября</h2><span class="tag">Сегодня</span></div><div class="schedule-list">${lessonRows()}</div></section>`}`+footer();}
function taskRows(){let list=tasks.filter(t=>filter==='done'?t.done:filter==='open'?!t.done:true);return list.map(t=>`<tr data-task-row><td><label><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><span><strong>${esc(t.title)}</strong><small>${esc(t.subject)}</small></span></label></td><td><span style="${t.id===1?'color:#b3724c':''}">${esc(t.date)}</span></td><td><span class="tag ${t.priority==='Высокий'?'orange':''}">${esc(t.priority)}</span></td><td><button class="icon-btn" data-edit="${t.id}" aria-label="Редактировать ${esc(t.title)}">${icon('chevron')}</button></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Здесь пока нет задач</td></tr>';}
function taskPage(){let done=tasks.filter(t=>t.done).length;return head('Задачи','Освободи голову. Всё важное уже здесь.',taskButton())+`<div class="toolbar"><div class="segments"><button data-filter="all" class="${filter==='all'?'selected':''}">Все задачи</button><button data-filter="open" class="${filter==='open'?'selected':''}">В работе</button><button data-filter="done" class="${filter==='done'?'selected':''}">Готово</button></div><input class="filter-input push" id="task-search" placeholder="Найти задачу" aria-label="Найти задачу"></div><div class="task-layout"><section class="panel" style="overflow:hidden;height:fit-content"><div class="task-group">На этой неделе <b>${tasks.length} задач</b></div><table class="task-table"><thead><tr><th>Задача и дисциплина</th><th>Срок</th><th>Приоритет</th><th></th></tr></thead><tbody>${taskRows()}</tbody></table><div style="padding:0 20px"><button class="add-mini" data-action="new-task">${icon('plus')}Добавить задачу</button></div></section><aside class="panel task-aside"><h3>Маленькие шаги считаются</h3><span class="number">${done}<span style="font-size:17px;color:var(--muted);letter-spacing:0"> / ${tasks.length}</span></span><p>задач завершено на этой неделе</p><div class="progress"><span style="width:${done/tasks.length*100}%"></span></div><p style="margin:22px 0">Начни с отчёта по лабораторной. Его нужно сдать сегодня.</p><a href="#assistant" class="text-btn" style="padding:0">Спланировать с ассистентом${icon('arrow')}</a></aside></div>`+footer();}
function assistant(){return head('Ассистент','Поможет разобраться с учебным днём',`<span class="tag">Пример диалога</span>`)+`<div class="chat-layout"><section class="panel chat"><div class="chat-history"><div class="chat-label">Сегодня, 10:47</div><div class="user-message">Помоги спланировать день. Мне нужно закончить лабораторную.</div><div class="assistant-message"><span class="spark">${icon('spark')}</span><div class="message-body"><h3>Давай оставим вечер свободным.</h3><p>Сегодня у тебя ещё две пары. Между ними есть <strong>окно с 13:00 до 14:20</strong> — можно спокойно закончить отчёт по базам данных.</p><div class="answer-card"><span class="spark">${icon('clock')}</span><div><strong>13:10 — 14:00 · Закончить отчёт</strong><p>50 минут на лабораторную №4, затем перерыв</p></div></div><p>После английского останется проверить работу и отправить её до 23:59. Добавим подготовку отчёта в задачи?</p><button class="btn primary" data-action="plan-task" style="margin-top:16px">${icon('plus')}Добавить в задачи</button><div><button class="source" data-action="source-schedule">${icon('calendar')}Расписание на 10 ноября</button><button class="source" data-action="source-tasks">${icon('check')}Твои задачи</button></div></div></div><div id="chat-extra"></div></div><div class="suggestions"><button data-question="Что изменилось в расписании?">Что изменилось в расписании?</button><button data-question="Где следующая пара?">Где следующая пара?</button></div><form id="chat-form" class="composer"><span class="muted">${icon('spark')}</span><input id="chat-input" placeholder="Спроси о расписании или задачах…" aria-label="Сообщение ассистенту" maxlength="300"><button class="btn primary" type="submit" aria-label="Отправить">${icon('send')}</button></form><p class="chat-disclaimer">Демонстрационный диалог · ответы подготовлены для просмотра дизайна</p></section><aside class="panel context"><div class="row">${icon('book')}<h3>Контекст разговора</h3></div><div class="context-item"><small>Твоя группа</small><strong>ПИ-31 · подгруппа 1</strong></div><div class="context-item"><small>Сегодня</small><strong>4 пары, до 15:40</strong></div><div class="context-item"><small>Ближайший дедлайн</small><strong>Лабораторная №4</strong><small style="margin:5px 0 0;color:#b3724c">Сегодня, 23:59</small></div><p>Ассистент показывает, на какие данные опирается. Новые задачи появляются только после твоего подтверждения.</p><span class="tag" style="margin-top:18px">Демо-данные</span></aside></div>`+footer();}
function render(focus=false){page=Object.hasOwn(titles,location.hash.slice(1))?location.hash.slice(1):'today';main.innerHTML=({today,schedule,tasks:taskPage,assistant}[page])();document.getElementById('crumb-title').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(a=>{a.classList.toggle('active',a.dataset.page===page);a.toggleAttribute('aria-current',a.dataset.page===page);if(a.dataset.page===page)a.setAttribute('aria-current','page')});document.getElementById('nav-count').textContent=tasks.filter(t=>!t.done).length;if(focus)main.querySelector('h1').focus();}
function notify(text){clearTimeout(toastTimer);const t=document.getElementById('toast');t.textContent=text;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,3500);}
function openDialog(content){dialogOpener=document.activeElement;dialog.innerHTML=`<button class="icon-btn close-dialog" data-action="close" aria-label="Закрыть">${icon('close')}</button>`+content;dialog.showModal();}
dialog.addEventListener('close',()=>{if(dialogOpener?.isConnected)dialogOpener.focus()});
function taskDialog(id=null,planned=false){const t=tasks.find(t=>t.id===id);openDialog(`<h2 id="dialog-title">${t?'Редактировать задачу':'Новая задача'}</h2><p>Одна небольшая задача — на шаг ближе к результату.</p><form id="task-form" data-id="${id||''}"><label for="task-title">Что нужно сделать</label><input id="task-title" name="title" required maxlength="150" value="${esc(t?.title||(planned?'Закончить отчёт по лабораторной №4':''))}" placeholder="Например, подготовиться к семинару"><label for="subject">Дисциплина</label><select id="subject" name="subject">${['Базы данных','Теория вероятностей','Веб-программирование','Философия','Личное'].map(s=>`<option ${t?.subject===s?'selected':''}>${s}</option>`).join('')}</select><div class="row"><div style="flex:1"><label for="due">Срок</label><input id="due" name="date" type="date" value="${t?.dueISO||({2:'2026-11-12',3:'2026-11-11',4:'2026-11-13'}[id])||'2026-11-10'}" required></div><div style="flex:1"><label for="priority">Приоритет</label><select id="priority" name="priority"><option ${t?.priority==='Высокий'?'selected':''}>Высокий</option><option ${t?.priority!=='Высокий'?'selected':''}>Обычный</option></select></div></div><p style="font-size:11px;color:var(--muted);margin-top:18px">В макете изменения сохраняются до перезагрузки страницы.</p><div class="dialog-footer"><button class="btn" type="button" data-action="close">Отмена</button><button class="btn primary">${t?'Сохранить':'Создать задачу'}</button></div></form>`);}
function lessonDialog(index,day,start,end){const l={...lessons[index]};if(start){l.time=start;l.end=end}const date=day===undefined?'вторник, 10 ноября':['понедельник, 9 ноября','вторник, 10 ноября','среда, 11 ноября','четверг, 12 ноября','пятница, 13 ноября'][Number(day)];openDialog(`<div class="detail-icon">${icon('book')}</div><h2 id="dialog-title">${l.name}</h2><p>${l.type} · ${date}</p><div class="detail-row"><span>Время</span><b>${l.time} — ${l.end}</b></div><div class="detail-row"><span>Преподаватель</span><b>${l.teacher}</b></div><div class="detail-row"><span>Аудитория</span><b>${l.room} · ${l.building}</b></div><div class="detail-row"><span>Группа</span><b>ПИ-31 · подгруппа 1</b></div><div class="dialog-footer"><button class="btn" data-action="ask-lesson">${icon('spark')}Спросить ассистента</button><button class="btn primary" data-action="new-task">${icon('plus')}Задача</button></div>`);}
function reply(question){if(!question.trim())return;const container=document.getElementById('chat-extra');let answer=question.toLowerCase().includes('измен')?'Английский язык сегодня пройдёт в аудитории 204 вместо 410. Время осталось прежним: 14:20–15:40.':question.toLowerCase().includes('пар')?'Следующая пара — веб-программирование в 11:40. Аудитория 115, корпус ФМИ.':'В этом макете показан пример планирования дня. Можно посмотреть источники ответа или добавить предложенную задачу — полноценного ИИ здесь пока нет.';container.insertAdjacentHTML('beforeend',`<div class="user-message">${esc(question)}</div><div class="assistant-message"><span class="spark">${icon('spark')}</span><div class="message-body"><p>${esc(answer)}</p><button class="source" data-action="source-schedule">${icon('calendar')}Демо-расписание</button></div></div>`);document.getElementById('chat-input').value='';container.lastElementChild.scrollIntoView({block:'nearest'});}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.lesson!==undefined){lessonDialog(Number(el.dataset.lesson),el.dataset.day,el.dataset.start,el.dataset.end);return}if(el.dataset.edit){taskDialog(Number(el.dataset.edit));return}if(el.dataset.mode){scheduleMode=el.dataset.mode;render();return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.dataset.question){reply(el.dataset.question);return}const a=el.dataset.action;if(!a)return;
if(a==='close'){dialog.close();return}if(a==='theme'){const dark=document.body.classList.toggle('dark');el.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');return}if(a==='new-task'||a==='plan-task'){if(dialog.open)dialog.close();taskDialog(null,a==='plan-task');return}if(a==='notifications'){openDialog(`<h2 id="dialog-title">Что изменилось</h2><p>Изменения в демонстрационном расписании</p><div class="update" style="margin-top:20px"><div><strong>Английский язык · сегодня, 14:20</strong><p>Аудитория <s>410</s> → <b>204</b></p></div></div><p style="margin-top:16px;font-size:12px;color:var(--muted)">Время и преподаватель остались прежними.</p><div class="dialog-footer"><button class="btn primary" data-action="source-schedule">Открыть расписание</button></div>`);return}if(a==='search'){openDialog(`<h2 id="dialog-title">Быстрый переход</h2><p>Выбери раздел приложения</p><div class="search-results">${Object.entries(titles).map(([key,title])=>`<a class="btn" href="#${key}" data-action="close">${title}${icon('arrow')}</a>`).join('')}</div>`);return}if(a==='group'){openDialog(`<h2 id="dialog-title">Твоя группа</h2><p>В этом прототипе выбран один учебный сценарий.</p><div class="detail-row"><span>Факультет</span><b>Математики и информатики</b></div><div class="detail-row"><span>Группа</span><b>ПИ-31</b></div><div class="detail-row"><span>Курс / подгруппа</span><b>3 курс / 1</b></div><div class="dialog-footer"><button class="btn primary" data-action="close">Понятно</button></div>`);return}if(a==='source-schedule'||a==='source-tasks'||a==='ask-lesson'){if(dialog.open)dialog.close();location.hash=a==='source-schedule'?'schedule':a==='source-tasks'?'tasks':'assistant';return}if(a==='week-day'&&el.dataset.day!=='1'){notify('Подробный сценарий в макете показан для вторника, 10 ноября.');return}if(a==='week-day'||a==='current-day'){scheduleMode='day';if(page==='schedule')render();else location.hash='schedule';return}if(a==='export'){notify('В макете экспорт не подключён. В приложении будет загрузка календаря ICS.');return}if(a==='fixed-week'){notify('Для просмотра дизайна доступна неделя 9–13 ноября.');return}if(a==='about'){openDialog(`<h2 id="dialog-title">Анна Ковалёва</h2><p>Демонстрационный профиль студентки</p><div class="detail-row"><span>Группа</span><b>ПИ-31 · 3 курс</b></div><div class="detail-row"><span>Приложение</span><b>Kupala Hub</b></div><div class="dialog-footer"><button class="btn primary" data-action="close">Закрыть</button></div>`)} });
document.addEventListener('change',e=>{if(e.target.dataset.task){const id=Number(e.target.dataset.task);tasks=tasks.map(t=>t.id===id?{...t,done:e.target.checked}:t);render();document.querySelector(`[data-task="${id}"]`)?.focus()}});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){const q=e.target.value.toLocaleLowerCase('ru');document.querySelectorAll('[data-task-row]').forEach(r=>r.hidden=!r.textContent.toLocaleLowerCase('ru').includes(q))}});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();reply(document.getElementById('chat-input').value)}if(e.target.id==='task-form'){e.preventDefault();const f=new FormData(e.target),id=Number(e.target.dataset.id),title=String(f.get('title')).trim();if(!title){document.getElementById('task-title').setCustomValidity('Добавь название задачи');document.getElementById('task-title').reportValidity();return}const update={title,dueISO:String(f.get('date')),subject:String(f.get('subject')),date:new Intl.DateTimeFormat('ru',{day:'numeric',month:'long'}).format(new Date(f.get('date')+'T12:00:00')),priority:String(f.get('priority'))};tasks=id?tasks.map(t=>t.id===id?{...t,...update}:t):[...tasks,{id:Date.now(),...update,done:false}];dialog.close();render();notify(id?'Изменения сохранены в макете':'Задача добавлена в макет')}});
document.addEventListener('input',e=>{if(e.target.id==='task-title')e.target.setCustomValidity('')});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dialog.open)document.querySelector('[data-action="search"]').click()}});
window.addEventListener('hashchange',()=>{render(true);window.scrollTo(0,0)});render();
</script></body></html>
