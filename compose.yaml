services:
  backend:
    build: .
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      AI_SERVICE_URL: http://ai:8001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Run npm run setup:agent first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001,http://127.0.0.1:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - kupala-data:/app/data
    restart: unless-stopped
  ai:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    environment:
      KUPALA_BACKEND_URL: http://backend:3001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Run npm run setup:agent first}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://llm.azati.ai}
    restart: unless-stopped
volumes:
  kupala-data:
